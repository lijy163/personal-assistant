databaseChangeLog:
  - changeSet:
      id: 009-add-stock-market-map-fields
      author: personal-assistant
      changes:
        - addColumn:
            tableName: stock_watch_item
            columns:
              - column: { name: industry, type: varchar(100) }
              - column: { name: latest_price, type: "numeric(18,4)" }
              - column: { name: change_percent, type: "numeric(10,4)" }
              - column: { name: market_value, type: "numeric(20,2)" }
              - column: { name: quote_time, type: timestamp }
        - createIndex:
            tableName: stock_watch_item
            indexName: idx_stock_watch_market_industry
            columns:
              - column: { name: user_id }
              - column: { name: market }
              - column: { name: industry }