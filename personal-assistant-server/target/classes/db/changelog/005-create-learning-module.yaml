databaseChangeLog:
  - changeSet:
      id: 005-create-learning-module
      author: personal-assistant
      changes:
        - createTable:
            tableName: learning_plan
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: topic, type: varchar(100), constraints: { nullable: false } }
              - column: { name: target, type: text }
              - column: { name: stage, type: varchar(100) }
              - column: { name: start_date, type: date }
              - column: { name: target_date, type: date }
              - column: { name: progress, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), defaultValue: NOT_STARTED, constraints: { nullable: false } }
              - column: { name: resource_links, type: text }
              - column: { name: review_time, type: timestamp }
              - column: { name: archived, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: learning_plan
            indexName: idx_learning_plan_user_status
            columns: [{ column: { name: user_id } }, { column: { name: status } }]
        - createTable:
            tableName: learning_record
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: plan_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_record_plan, references: learning_plan(id), deleteCascade: true } }
              - column: { name: content, type: text, constraints: { nullable: false } }
              - column: { name: duration_minutes, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: result, type: text }
              - column: { name: problem, type: text }
              - column: { name: next_action, type: text }
              - column: { name: record_time, type: timestamp, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: learning_summary
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: plan_id, type: bigint, constraints: { foreignKeyName: fk_summary_plan, references: learning_plan(id), deleteCascade: true } }
              - column: { name: summary_type, type: varchar(20), constraints: { nullable: false } }
              - column: { name: period_start, type: date, constraints: { nullable: false } }
              - column: { name: period_end, type: date, constraints: { nullable: false } }
              - column: { name: gains, type: text }
              - column: { name: problems, type: text }
              - column: { name: improvements, type: text }
              - column: { name: markdown_content, type: text, constraints: { nullable: false } }
              - column: { name: tags, type: varchar(1000) }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }