databaseChangeLog:
  - changeSet:
      id: 011-create-devlog-module
      author: personal-assistant
      changes:
        - createTable:
            tableName: personal_access_token
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: token_prefix, type: varchar(20), constraints: { nullable: false } }
              - column: { name: token_hash, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: scope, type: varchar(100), constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamp }
              - column: { name: last_used_at, type: timestamp }
              - column: { name: revoked_at, type: timestamp }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: personal_access_token
            indexName: idx_pat_user_created
            columns: [{ column: { name: user_id } }, { column: { name: created_at } }]
        - createTable:
            tableName: dev_log
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: fingerprint, type: varchar(64), constraints: { nullable: false } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: project_name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: repository, type: varchar(500) }
              - column: { name: branch_name, type: varchar(200) }
              - column: { name: commit_hash, type: varchar(64) }
              - column: { name: task_goal, type: text, constraints: { nullable: false } }
              - column: { name: core_changes, type: text, constraints: { nullable: false } }
              - column: { name: technical_decisions, type: text }
              - column: { name: problem_solution, type: text }
              - column: { name: verification_result, type: text }
              - column: { name: tags, type: varchar(1000) }
              - column: { name: source, type: varchar(40), constraints: { nullable: false } }
              - column: { name: occurred_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: markdown_content, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: dev_log
            columnNames: user_id, fingerprint
            constraintName: uk_dev_log_user_fingerprint
        - createIndex:
            tableName: dev_log
            indexName: idx_dev_log_user_occurred
            columns: [{ column: { name: user_id } }, { column: { name: occurred_at, descending: true } }]
