databaseChangeLog:
  - changeSet:
      id: 030-create-trading-alert
      author: personal-assistant
      changes:
        - createTable:
            tableName: trading_alert_rule
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: watch_item_id, type: bigint }
              - column: { name: plan_id, type: bigint }
              - column: { name: stock_code, type: varchar(40), constraints: { nullable: false } }
              - column: { name: stock_name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: rule_type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: direction, type: varchar(20), constraints: { nullable: false } }
              - column: { name: threshold_value, type: "numeric(18,4)", constraints: { nullable: false } }
              - column: { name: reference_position, type: "numeric(12,4)" }
              - column: { name: title, type: varchar(160), constraints: { nullable: false } }
              - column: { name: note, type: text }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: once_only, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: status, type: varchar(30), defaultValue: MONITORING, constraints: { nullable: false } }
              - column: { name: valid_from, type: date }
              - column: { name: valid_to, type: date }
              - column: { name: last_checked_at, type: timestamp }
              - column: { name: last_triggered_at, type: timestamp }
              - column: { name: last_observed_value, type: "numeric(18,4)" }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: trading_alert_rule
            baseColumnNames: watch_item_id
            referencedTableName: stock_watch_item
            referencedColumnNames: id
            constraintName: fk_trading_alert_rule_watch
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: trading_alert_rule
            baseColumnNames: plan_id
            referencedTableName: trading_next_plan
            referencedColumnNames: id
            constraintName: fk_trading_alert_rule_plan
            onDelete: SET NULL
        - createIndex:
            tableName: trading_alert_rule
            indexName: idx_trading_alert_rule_user_enabled
            columns:
              - column: { name: user_id }
              - column: { name: enabled }
              - column: { name: updated_at }
        - createTable:
            tableName: trading_alert_event
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: rule_id, type: bigint, constraints: { nullable: false } }
              - column: { name: watch_item_id, type: bigint }
              - column: { name: stock_code, type: varchar(40), constraints: { nullable: false } }
              - column: { name: stock_name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: rule_type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: direction, type: varchar(20), constraints: { nullable: false } }
              - column: { name: threshold_value, type: "numeric(18,4)", constraints: { nullable: false } }
              - column: { name: observed_value, type: "numeric(18,4)", constraints: { nullable: false } }
              - column: { name: latest_price, type: "numeric(18,4)" }
              - column: { name: change_percent, type: "numeric(12,4)" }
              - column: { name: title, type: varchar(160), constraints: { nullable: false } }
              - column: { name: content, type: text }
              - column: { name: notification_status, type: varchar(30), constraints: { nullable: false } }
              - column: { name: notification_message, type: text }
              - column: { name: triggered_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: trading_alert_event
            baseColumnNames: rule_id
            referencedTableName: trading_alert_rule
            referencedColumnNames: id
            constraintName: fk_trading_alert_event_rule
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: trading_alert_event
            baseColumnNames: watch_item_id
            referencedTableName: stock_watch_item
            referencedColumnNames: id
            constraintName: fk_trading_alert_event_watch
            onDelete: SET NULL
        - createIndex:
            tableName: trading_alert_event
            indexName: idx_trading_alert_event_user_time
            columns:
              - column: { name: user_id }
              - column: { name: triggered_at }
