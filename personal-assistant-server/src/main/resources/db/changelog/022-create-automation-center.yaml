databaseChangeLog:
  - changeSet:
      id: 022-create-automation-center
      author: codex
      changes:
        - createTable:
            tableName: automation_rule
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: trigger_type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: trigger_config, type: text, constraints: { nullable: false } }
              - column: { name: condition_config, type: text }
              - column: { name: action_type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: action_config, type: text, constraints: { nullable: false } }
              - column: { name: cooldown_minutes, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: next_run_at, type: timestamp }
              - column: { name: last_run_at, type: timestamp }
              - column: { name: last_status, type: varchar(20) }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex: { tableName: automation_rule, indexName: idx_automation_rule_scan, columns: [ { column: { name: enabled } }, { column: { name: next_run_at } } ] }
        - createTable:
            tableName: automation_execution
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: rule_id, type: bigint, constraints: { nullable: false } }
              - column: { name: source_type, type: varchar(40) }
              - column: { name: source_id, type: varchar(100) }
              - column: { name: idempotency_key, type: varchar(200), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), constraints: { nullable: false } }
              - column: { name: attempt_count, type: int, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: result_type, type: varchar(40) }
              - column: { name: result_id, type: bigint }
              - column: { name: failure_reason, type: text }
              - column: { name: started_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: finished_at, type: timestamp }
        - addUniqueConstraint: { tableName: automation_execution, columnNames: user_id, idempotency_key, constraintName: uk_automation_execution_idempotent }
        - createIndex: { tableName: automation_execution, indexName: idx_automation_execution_rule, columns: [ { column: { name: user_id } }, { column: { name: rule_id } }, { column: { name: started_at, descending: true } } ] }
