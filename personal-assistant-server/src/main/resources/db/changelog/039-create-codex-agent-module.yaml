databaseChangeLog:
  - changeSet:
      id: 039-create-codex-agent-module
      author: personal-assistant
      changes:
        - createTable:
            tableName: codex_agent
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: token_prefix, type: varchar(24), constraints: { nullable: false } }
              - column: { name: token_hash, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: status, type: varchar(20), defaultValue: OFFLINE, constraints: { nullable: false } }
              - column: { name: last_seen_at, type: timestamp }
              - column: { name: revoked_at, type: timestamp }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: codex_agent
            indexName: idx_codex_agent_user_created
            columns: [{ column: { name: user_id } }, { column: { name: created_at, descending: true } }]
        - createTable:
            tableName: codex_task
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: agent_id, type: bigint, constraints: { nullable: false } }
              - column: { name: project_key, type: varchar(100), constraints: { nullable: false } }
              - column: { name: prompt, type: text, constraints: { nullable: false } }
              - column: { name: permission_mode, type: varchar(30), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), defaultValue: PENDING, constraints: { nullable: false } }
              - column: { name: lease_id, type: varchar(64) }
              - column: { name: lease_expires_at, type: timestamp }
              - column: { name: thread_id, type: varchar(100) }
              - column: { name: final_response, type: text }
              - column: { name: error_message, type: text }
              - column: { name: requested_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: started_at, type: timestamp }
              - column: { name: finished_at, type: timestamp }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: codex_task
            baseColumnNames: agent_id
            referencedTableName: codex_agent
            referencedColumnNames: id
            constraintName: fk_codex_task_agent
            onDelete: CASCADE
        - createIndex:
            tableName: codex_task
            indexName: idx_codex_task_agent_status
            columns: [{ column: { name: agent_id } }, { column: { name: status } }, { column: { name: requested_at } }]
        - createIndex:
            tableName: codex_task
            indexName: idx_codex_task_user_requested
            columns: [{ column: { name: user_id } }, { column: { name: requested_at, descending: true } }]
        - createTable:
            tableName: codex_task_event
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: task_id, type: bigint, constraints: { nullable: false } }
              - column: { name: event_type, type: varchar(80), constraints: { nullable: false } }
              - column: { name: content, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: codex_task_event
            baseColumnNames: task_id
            referencedTableName: codex_task
            referencedColumnNames: id
            constraintName: fk_codex_task_event_task
            onDelete: CASCADE
        - createIndex:
            tableName: codex_task_event
            indexName: idx_codex_task_event_task_created
            columns: [{ column: { name: task_id } }, { column: { name: created_at } }]
