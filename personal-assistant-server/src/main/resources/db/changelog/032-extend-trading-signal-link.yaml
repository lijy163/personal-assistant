databaseChangeLog:
  - changeSet:
      id: 032-extend-trading-signal-link
      author: codex
      changes:
        - addColumn:
            tableName: trading_log
            columns:
              - column: { name: source_alert_event_id, type: bigint }
              - column: { name: source_market_alert_event_id, type: bigint }
              - column: { name: signal_type, type: varchar(40) }
              - column: { name: signal_reason, type: varchar(1000) }
        - createIndex:
            tableName: trading_log
            indexName: idx_trading_log_source_alert
            columns:
              - column: { name: user_id }
              - column: { name: source_alert_event_id }
        - createIndex:
            tableName: trading_log
            indexName: idx_trading_log_source_market_alert
            columns:
              - column: { name: user_id }
              - column: { name: source_market_alert_event_id }
