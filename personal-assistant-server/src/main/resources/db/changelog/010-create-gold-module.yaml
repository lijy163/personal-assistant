databaseChangeLog:
  - changeSet:
      id: 010-create-gold-module
      author: personal-assistant
      changes:
        - createTable:
            tableName: gold_watch_item
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: gold_type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: brand_name, type: varchar(100) }
              - column: { name: display_name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: unit, type: varchar(30), constraints: { nullable: false } }
              - column: { name: latest_price, type: "numeric(18,4)" }
              - column: { name: change_amount, type: "numeric(18,4)" }
              - column: { name: change_percent, type: "numeric(10,4)" }
              - column: { name: high_price, type: "numeric(18,4)" }
              - column: { name: low_price, type: "numeric(18,4)" }
              - column: { name: open_price, type: "numeric(18,4)" }
              - column: { name: previous_close, type: "numeric(18,4)" }
              - column: { name: buy_price, type: "numeric(18,4)" }
              - column: { name: sell_price, type: "numeric(18,4)" }
              - column: { name: quote_time, type: timestamp }
              - column: { name: source_name, type: varchar(100) }
              - column: { name: source_url, type: varchar(1000) }
              - column: { name: remark, type: text }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: gold_watch_item
            columnNames: user_id, gold_type, display_name, unit
            constraintName: uk_gold_watch_user_type_name_unit
        - createIndex:
            tableName: gold_watch_item
            indexName: idx_gold_watch_user_type
            columns: [{ column: { name: user_id } }, { column: { name: gold_type } }]
        - createTable:
            tableName: gold_api_config
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: api_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: purpose, type: varchar(200) }
              - column: { name: endpoint, type: varchar(1000), constraints: { nullable: false } }
              - column: { name: auth_type, type: varchar(30), constraints: { nullable: false } }
              - column: { name: api_key_encrypted, type: text }
              - column: { name: rate_limit_per_minute, type: int, defaultValueNumeric: 60, constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: last_test_time, type: timestamp }
              - column: { name: last_test_success, type: boolean }
              - column: { name: last_test_message, type: text }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: gold_collection_result
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: watch_item_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_gold_result_watch, references: gold_watch_item(id), deleteCascade: true } }
              - column: { name: api_config_id, type: bigint }
              - column: { name: success, type: boolean, constraints: { nullable: false } }
              - column: { name: summary, type: text }
              - column: { name: raw_data, type: text }
              - column: { name: error_message, type: text }
              - column: { name: collected_at, type: timestamp, constraints: { nullable: false } }
        - createIndex:
            tableName: gold_collection_result
            indexName: idx_gold_result_watch_time
            columns: [{ column: { name: watch_item_id } }, { column: { name: collected_at } }]