databaseChangeLog:
  - changeSet:
      id: 012-create-stock-fund-flow
      author: personal-assistant
      changes:
        - createTable:
            tableName: stock_fund_flow_snapshot
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: watch_item_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_fund_flow_watch, references: stock_watch_item(id), deleteCascade: true } }
              - column: { name: stock_code, type: varchar(40), constraints: { nullable: false } }
              - column: { name: market, type: varchar(20), constraints: { nullable: false } }
              - column: { name: main_net_inflow, type: "numeric(22,4)" }
              - column: { name: main_net_ratio, type: "numeric(12,4)" }
              - column: { name: super_large_net_inflow, type: "numeric(22,4)" }
              - column: { name: super_large_net_ratio, type: "numeric(12,4)" }
              - column: { name: large_net_inflow, type: "numeric(22,4)" }
              - column: { name: large_net_ratio, type: "numeric(12,4)" }
              - column: { name: medium_net_inflow, type: "numeric(22,4)" }
              - column: { name: medium_net_ratio, type: "numeric(12,4)" }
              - column: { name: small_net_inflow, type: "numeric(22,4)" }
              - column: { name: small_net_ratio, type: "numeric(12,4)" }
              - column: { name: latest_price, type: "numeric(18,4)" }
              - column: { name: change_percent, type: "numeric(12,4)" }
              - column: { name: turnover_amount, type: "numeric(22,4)" }
              - column: { name: provider, type: varchar(80), constraints: { nullable: false } }
              - column: { name: period_type, type: varchar(20), constraints: { nullable: false } }
              - column: { name: quote_time, type: timestamp, constraints: { nullable: false } }
              - column: { name: collected_at, type: timestamp, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: stock_fund_flow_snapshot
            columnNames: user_id, watch_item_id, provider, period_type, quote_time
            constraintName: uk_fund_flow_snapshot_point
        - createIndex:
            tableName: stock_fund_flow_snapshot
            indexName: idx_fund_flow_user_time
            columns: [{ column: { name: user_id } }, { column: { name: quote_time, descending: true } }]
        - createIndex:
            tableName: stock_fund_flow_snapshot
            indexName: idx_fund_flow_watch_time
            columns: [{ column: { name: watch_item_id } }, { column: { name: quote_time, descending: true } }]
        - createTable:
            tableName: stock_fund_flow_collection
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: watch_item_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_fund_flow_collection_watch, references: stock_watch_item(id), deleteCascade: true } }
              - column: { name: success, type: boolean, constraints: { nullable: false } }
              - column: { name: snapshot_count, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: provider, type: varchar(80), constraints: { nullable: false } }
              - column: { name: error_message, type: text }
              - column: { name: collected_at, type: timestamp, constraints: { nullable: false } }
        - createIndex:
            tableName: stock_fund_flow_collection
            indexName: idx_fund_flow_collection_user_time
            columns: [{ column: { name: user_id } }, { column: { name: collected_at, descending: true } }]
