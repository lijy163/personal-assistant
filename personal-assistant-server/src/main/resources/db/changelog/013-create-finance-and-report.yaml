databaseChangeLog:
  - changeSet:
      id: 013-create-finance-and-report
      author: personal-assistant
      changes:
        - createTable:
            tableName: finance_account
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: account_name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: account_type, type: varchar(30), constraints: { nullable: false } }
              - column: { name: institution, type: varchar(120) }
              - column: { name: currency, type: varchar(10), defaultValue: CNY, constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: finance_account, columnNames: user_id, account_name, constraintName: uk_finance_account_user_name }
        - createTable:
            tableName: finance_category
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: category_name, type: varchar(80), constraints: { nullable: false } }
              - column: { name: direction, type: varchar(20), constraints: { nullable: false } }
              - column: { name: parent_id, type: bigint }
              - column: { name: sort_order, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: finance_category, columnNames: user_id, direction, category_name, constraintName: uk_finance_category_user_direction_name }
        - createTable:
            tableName: finance_category_rule
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: rule_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: keyword, type: varchar(200), constraints: { nullable: false } }
              - column: { name: category_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_finance_rule_category, references: finance_category(id) } }
              - column: { name: priority, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: finance_import_batch
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: account_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_finance_batch_account, references: finance_account(id) } }
              - column: { name: platform, type: varchar(30), constraints: { nullable: false } }
              - column: { name: file_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: file_hash, type: varchar(64), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), constraints: { nullable: false } }
              - column: { name: total_count, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: duplicate_count, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: imported_count, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: error_message, type: text }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: confirmed_at, type: timestamp }
        - addUniqueConstraint: { tableName: finance_import_batch, columnNames: user_id, account_id, file_hash, constraintName: uk_finance_batch_file }
        - createTable:
            tableName: finance_raw_transaction
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: batch_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_finance_raw_batch, references: finance_import_batch(id), deleteCascade: true } }
              - column: { name: row_number, type: int, constraints: { nullable: false } }
              - column: { name: raw_json, type: text, constraints: { nullable: false } }
              - column: { name: transaction_time, type: timestamp }
              - column: { name: platform_transaction_no, type: varchar(160) }
              - column: { name: merchant, type: varchar(255) }
              - column: { name: description, type: text }
              - column: { name: direction, type: varchar(20) }
              - column: { name: amount, type: "numeric(18,2)" }
              - column: { name: transaction_type, type: varchar(30) }
              - column: { name: category_id, type: bigint }
              - column: { name: fingerprint, type: varchar(64), constraints: { nullable: false } }
              - column: { name: duplicate_flag, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: validation_error, type: text }
        - createIndex: { tableName: finance_raw_transaction, indexName: idx_finance_raw_batch, columns: [{ column: { name: batch_id } }] }
        - createTable:
            tableName: finance_transaction
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: account_id, type: bigint, constraints: { nullable: false, foreignKeyName: fk_finance_tx_account, references: finance_account(id) } }
              - column: { name: import_batch_id, type: bigint }
              - column: { name: category_id, type: bigint }
              - column: { name: fingerprint, type: varchar(64), constraints: { nullable: false } }
              - column: { name: platform_transaction_no, type: varchar(160) }
              - column: { name: transaction_time, type: timestamp, constraints: { nullable: false } }
              - column: { name: merchant, type: varchar(255) }
              - column: { name: description, type: text }
              - column: { name: direction, type: varchar(20), constraints: { nullable: false } }
              - column: { name: amount, type: "numeric(18,2)", constraints: { nullable: false } }
              - column: { name: transaction_type, type: varchar(30), constraints: { nullable: false } }
              - column: { name: note, type: text }
              - column: { name: confirmed, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: finance_transaction, columnNames: user_id, fingerprint, constraintName: uk_finance_tx_user_fingerprint }
        - createIndex: { tableName: finance_transaction, indexName: idx_finance_tx_user_time, columns: [{ column: { name: user_id } }, { column: { name: transaction_time, descending: true } }] }
        - createTable:
            tableName: finance_reconciliation
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: source_transaction_id, type: bigint, constraints: { nullable: false } }
              - column: { name: target_transaction_id, type: bigint, constraints: { nullable: false } }
              - column: { name: relation_type, type: varchar(30), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: generated_report
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: report_type, type: varchar(30), constraints: { nullable: false } }
              - column: { name: period_start, type: date, constraints: { nullable: false } }
              - column: { name: period_end, type: date, constraints: { nullable: false } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: markdown_content, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: generated_report, columnNames: user_id, report_type, period_start, period_end, constraintName: uk_generated_report_period }
