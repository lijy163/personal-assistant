databaseChangeLog:
  - changeSet:
      id: 024-create-finance-planning
      author: codex
      changes:
        - createTable:
            tableName: finance_budget
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: period_type, type: varchar(20), constraints: { nullable: false } }
              - column: { name: period_key, type: varchar(10), constraints: { nullable: false } }
              - column: { name: category_id, type: bigint }
              - column: { name: amount, type: "numeric(18,2)", constraints: { nullable: false } }
              - column: { name: alert_percent, type: int, defaultValueNumeric: 80, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: finance_budget, columnNames: user_id, period_type, period_key, category_id, constraintName: uk_finance_budget_period }
        - createTable:
            tableName: finance_recurring_charge
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: merchant, type: varchar(255), constraints: { nullable: false } }
              - column: { name: charge_type, type: varchar(30), constraints: { nullable: false } }
              - column: { name: expected_amount, type: "numeric(18,2)" }
              - column: { name: frequency_days, type: int }
              - column: { name: next_charge_date, type: date }
              - column: { name: active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: last_detected_at, type: timestamp }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: finance_net_worth_snapshot
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: snapshot_date, type: date, constraints: { nullable: false } }
              - column: { name: total_assets, type: "numeric(18,2)", constraints: { nullable: false } }
              - column: { name: total_liabilities, type: "numeric(18,2)", constraints: { nullable: false } }
              - column: { name: details_json, type: text }
              - column: { name: note, type: text }
              - column: { name: created_at, type: timestamp, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: finance_net_worth_snapshot, columnNames: user_id, snapshot_date, constraintName: uk_net_worth_date }
        - createTable:
            tableName: finance_anomaly
            columns:
              - column: { name: id, type: bigserial, constraints: { primaryKey: true } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: transaction_id, type: bigint }
              - column: { name: anomaly_type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: severity, type: varchar(20), constraints: { nullable: false } }
              - column: { name: message, type: text, constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), defaultValue: OPEN, constraints: { nullable: false } }
              - column: { name: detected_at, type: timestamp, constraints: { nullable: false } }
        - createIndex: { tableName: finance_anomaly, indexName: idx_finance_anomaly_user, columns: [ { column: { name: user_id } }, { column: { name: status } } ] }
